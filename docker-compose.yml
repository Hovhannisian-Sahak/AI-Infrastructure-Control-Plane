services:
  postgres:
    image: postgres:16
    container_name: beecloud-postgres
    environment:
      POSTGRES_DB: beecloud
      POSTGRES_USER: beecloud
      POSTGRES_PASSWORD: beecloud_dev_password
    ports:
      - "5432:5432"
    volumes:
      - beecloud-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: beecloud-redis
    ports:
      - "6379:6379"
    volumes:
      - beecloud-redis-data:/data

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: beecloud-jaeger
    ports:
      - "16686:16686"
      - "4317:4317"

  prometheus:
    image: prom/prometheus:latest
    container_name: beecloud-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:latest
    container_name: beecloud-grafana
    ports:
      - "3000:3000"
    volumes:
      - beecloud-grafana-data:/var/lib/grafana

volumes:
  beecloud-postgres-data:
  beecloud-redis-data:
  beecloud-grafana-data: