apiVersion: apps/v1
kind: Deployment
metadata:
  name: beecloud-ui
  namespace: beecloud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: beecloud-ui
  template:
    metadata:
      labels:
        app: beecloud-ui
    spec:
      containers:
        - name: ui
          image: beecloud-ui:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          readinessProbe:
            httpGet:
              path: /
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: beecloud-ui
  namespace: beecloud
spec:
  selector:
    app: beecloud-ui
  ports:
    - port: 3001
      targetPort: 3001
  type: ClusterIP
