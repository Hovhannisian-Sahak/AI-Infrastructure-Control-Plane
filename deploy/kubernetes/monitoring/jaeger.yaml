apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: beecloud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
        - name: jaeger
          image: cr.jaegertracing.io/jaegertracing/jaeger:2.21.0
          imagePullPolicy: IfNotPresent
          env:
            - name: OTEL_COLLECTOR_OTLP_ENABLED
              value: "true"
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: query
              containerPort: 16686

---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: beecloud
spec:
  selector:
    app: jaeger
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
    - name: query
      port: 16686
      targetPort: 16686
  type: ClusterIP