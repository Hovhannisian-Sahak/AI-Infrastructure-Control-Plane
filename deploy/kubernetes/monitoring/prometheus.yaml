apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: beecloud
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s

    scrape_configs:
      - job_name: "beecloud-api"
        metrics_path: "/metrics"
        static_configs:
          - targets:
              - "beecloud-api:80"

      - job_name: "kube-state-metrics"
        metrics_path: "/metrics"
        static_configs:
          - targets:
              - "kube-state-metrics:8080"

      - job_name: "kubelet-cadvisor"
        scheme: https
        kubernetes_sd_configs:
          - role: node
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        metrics_path: /metrics
        relabel_configs:
          - source_labels:
              - __meta_kubernetes_node_name
            target_label: __metrics_path__
            replacement: "/api/v1/nodes/$1/proxy/metrics/cadvisor"
          - target_label: __address__
            replacement: "kubernetes.default.svc:443"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: beecloud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.53.0
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-config

---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: beecloud
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
  type: ClusterIP