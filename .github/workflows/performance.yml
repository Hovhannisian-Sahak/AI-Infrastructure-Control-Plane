name: Performance tests

on:
  workflow_dispatch:
    inputs:
      profile:
        description: JMeter workload profile
        required: true
        type: choice
        options:
          - baseline
          - load
          - stress
          - spike
          - soak
      include_writes:
        description: Create and delete temporary networks (disposable database only)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: performance-staging
  cancel-in-progress: false

jobs:
  run-performance:
    name: Run JMeter profile
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: performance
    if: vars.PERFORMANCE_API_BASE_URL != '' && vars.PERFORMANCE_UI_BASE_URL != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install Apache JMeter
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.zip \
            --output "$RUNNER_TEMP/apache-jmeter.zip"
          unzip -q "$RUNNER_TEMP/apache-jmeter.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-jmeter-5.6.3/bin" >> "$GITHUB_PATH"
      - name: Validate configured performance environment
        shell: pwsh
        env:
          PERFORMANCE_API_BASE_URL: ${{ vars.PERFORMANCE_API_BASE_URL }}
          PERFORMANCE_UI_BASE_URL: ${{ vars.PERFORMANCE_UI_BASE_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PERFORMANCE_API_BASE_URL) -or
              [string]::IsNullOrWhiteSpace($env:PERFORMANCE_UI_BASE_URL)) {
            throw "Configure PERFORMANCE_API_BASE_URL and PERFORMANCE_UI_BASE_URL in the protected 'performance' GitHub environment."
          }
      - name: Run selected profile
        shell: pwsh
        env:
          PERFORMANCE_API_BASE_URL: ${{ vars.PERFORMANCE_API_BASE_URL }}
          PERFORMANCE_UI_BASE_URL: ${{ vars.PERFORMANCE_UI_BASE_URL }}
          PERFORMANCE_NODE_ID: ${{ vars.PERFORMANCE_NODE_ID }}
          PERFORMANCE_PROFILE: ${{ inputs.profile }}
          PERFORMANCE_PROFILE: ${{ inputs.profile }}
          INCLUDE_WRITES: ${{ inputs.include_writes }}
        run: |
          $selectedProfile = $env:PERFORMANCE_PROFILE
          if ($selectedProfile -notin @("baseline", "load", "stress", "spike", "soak")) {
            throw "Unsupported performance profile '$selectedProfile'."
          }
          $includeWrites = $env:INCLUDE_WRITES -eq "true"
          & ./tests/performance/run-performance.ps1 `
            -Profile $selectedProfile `
            -ApiBaseUrl $env:PERFORMANCE_API_BASE_URL `
            -UiBaseUrl $env:PERFORMANCE_UI_BASE_URL `
            -NodeId $env:PERFORMANCE_NODE_ID `
            -IncludeWrites:$includeWrites `
            -AllowRemoteTarget
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
      - name: Upload JMeter results and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-${{ inputs.profile }}-${{ github.run_id }}
          path: tests/performance/results/
          if-no-files-found: ignore
          retention-days: 30
